<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Maham Code</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #1e1e1e; color: #ddd; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { white-space: pre-wrap; margin: 0 0 12px; line-height: 1.4; }
  .you { color: #8ab4f8; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #333; }
  input { flex: 1; padding: 8px; background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 4px; }
  button { padding: 8px 14px; }
</style>
</head>
<body>
<div id="log"></div>
<form id="f">
  <input id="q" placeholder="Ask something..." autofocus>
  <button>Send</button>
  <button type="button" id="reset">Reset</button>
</form>
<script>
  const log = document.getElementById("log");
  let current = null;

  function add(text, cls) {
    const p = document.createElement("p");
    p.className = "msg " + cls;
    p.textContent = text;
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
    return p;
  }

  // Python calls this for every streamed chunk.
  function appendChunk(text) {
    current.textContent += text;
    log.scrollTop = log.scrollHeight;
  }

  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const q = document.getElementById("q");
    const text = q.value.trim();
    if (!text) return;
    q.value = "";
    add("you > " + text, "you");
    current = add("", "bot");
    await pywebview.api.send(text);
  };

  document.getElementById("reset").onclick = () => {
    pywebview.api.reset();
    log.innerHTML = "";
  };
</script>
</body>
</html>
